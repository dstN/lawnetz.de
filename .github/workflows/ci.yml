name: CI - Build, Test & Accessibility

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Run Automated A11y Suite
    runs-on: ubuntu-latest

    # The law and norm pages read MySQL; tests/fixtures/laws.sql is a few laws
    # from gesetze-im-internet.de, enough for every page type and the glossary.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lawnetz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_URL: mysql://root@127.0.0.1:3306/lawnetz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Load the Test Database
        run: |
          npx drizzle-kit push --force
          mysql -h 127.0.0.1 -u root --default-character-set=utf8mb4 lawnetz < tests/fixtures/laws.sql

      - name: Build Astro Application
        run: npm run build

      - name: Run A11y & Smoke Test Suite
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WCAG 2.2 AAA E2E Suite (axe-core + AAA checks)
        run: npm run test:a11y

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lawnetz-build
          path: dist/
          retention-days: 7
